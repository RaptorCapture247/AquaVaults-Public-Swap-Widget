<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaVaults Public SDK — Runtime Controls Example</title>
  <script src="https://aquavaults.com/sdk/aquavaults-sdk-open.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 480px;
      gap: 40px;
      align-items: start;
    }
    h1 { margin-top: 0; }
    p, li { color: #9aa4b2; line-height: 1.6; }
    code { color: #b9f6e8; }
    a { color: #55d6be; }
    .panel {
      border: 1px solid #242a35;
      border-radius: 14px;
      background: #11151d;
      padding: 18px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid #303846;
      background: #161c26;
      color: #e6edf3;
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { border-color: #55d6be; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>
  <main class="page">
    <div class="layout">
      <section>
        <h1>Runtime controls</h1>

        <div class="panel">
          <button id="wallet-state">Log wallet state</button>
          <button id="config">Log resolved config</button>
          <button id="sol-usdc">Set SOL → USDC</button>
          <button id="community">Set community → aquavaults</button>
          <button id="destroy">Destroy widget</button>
        </div>

        <p>
          <code>setToken()</code> is for mints already known to the token registry.
          Use deep links for arbitrary unknown token mints.
        </p>
      </section>

      <section>
        <div id="swap-widget"></div>
      </section>
    </div>
  </main>

  <script>
    const SOL  = 'So11111111111111111111111111111111111111112';
    const USDC = 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';

    const swapper = AquaVaultsSDK.mount('#swap-widget', {
      apiBase: 'https://aquavaults.com',
      community: 'aquavaults',
      lockCommunity: false,
    });

    document.getElementById('wallet-state').onclick = () =>
      console.log(swapper.getWalletState());

    document.getElementById('config').onclick = () =>
      console.log(swapper.getConfig());

    document.getElementById('sol-usdc').onclick = () => {
      swapper.setToken('from', SOL);
      swapper.setToken('to', USDC);
    };

    document.getElementById('community').onclick = () =>
      swapper.setCommunity('aquavaults');

    document.getElementById('destroy').onclick = () =>
      swapper.destroy();
  </script>
</body>
</html>
