<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaVaults Public SDK — Theme Example</title>
  <script src="https://aquavaults.com/sdk/aquavaults-sdk-open.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 480px;
      gap: 40px;
      align-items: start;
    }
    h1 { margin-top: 0; }
    p, li { color: #9aa4b2; line-height: 1.6; }
    code { color: #b9f6e8; }
    a { color: #55d6be; }
    .panel {
      border: 1px solid #242a35;
      border-radius: 14px;
      background: #11151d;
      padding: 18px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid #303846;
      background: #161c26;
      color: #e6edf3;
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { border-color: #55d6be; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>

  <style>
    #swap-widget {
      max-width: 430px;
      margin: 0 auto;

      --av-bg-card: #151018;
      --av-bg-input: #201724;
      --av-border: #ff8bd7;
      --av-border-subtle: rgba(255, 139, 215, 0.28);
      --av-text: #fff7fd;
      --av-text-muted: #c7a9bf;
      --av-accent: #ff8bd7;
      --av-accent-hover: rgba(255, 139, 215, 0.16);
      --av-success: #72e8aa;
      --av-error: #ff6b7d;
      --av-warning: #ffc66d;
      --av-radius: 24px;
      --av-radius-sm: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Custom theme</h1>
    <p>
      The example changes only the documented AquaVaults CSS variables and
      constrains the host container width.
    </p>

    <div id="swap-widget"></div>
  </main>

  <script>
    AquaVaultsSDK.mount('#swap-widget', {
      apiBase: 'https://aquavaults.com',
      community: 'aquavaults',
      lockCommunity: false,
    });
  </script>
</body>
</html>
