<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaVaults Public SDK — Existing Wallet Example</title>
  <script src="https://aquavaults.com/sdk/aquavaults-sdk-open.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 480px;
      gap: 40px;
      align-items: start;
    }
    h1 { margin-top: 0; }
    p, li { color: #9aa4b2; line-height: 1.6; }
    code { color: #b9f6e8; }
    a { color: #55d6be; }
    .panel {
      border: 1px solid #242a35;
      border-radius: 14px;
      background: #11151d;
      padding: 18px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid #303846;
      background: #161c26;
      color: #e6edf3;
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { border-color: #55d6be; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>
  <main class="page">
    <div class="layout">
      <section>
        <h1>Public SDK — use the host site's wallet</h1>
        <p>
          This demo treats Phantom as the wallet connection owned by the host
          page. In a real application, replace <code>provider</code> with the
          provider/adapter your existing wallet UI already controls.
        </p>

        <div class="panel">
          <button id="host-connect">Host: Connect wallet</button>
          <button id="host-disconnect">Host: Disconnect wallet</button>
          <p id="host-state">Host wallet: disconnected</p>
        </div>
      </section>

      <section>
        <div id="swap-widget"></div>
      </section>
    </div>
  </main>

  <script>
    const provider = window.phantom?.solana;

    if (!provider) {
      document.getElementById('host-state').textContent =
        'This demo needs Phantom installed. Replace provider with your site wallet in production.';
    }

    const hostWalletAdapter = {
      get connected() {
        return Boolean(provider?.connected || provider?.isConnected);
      },

      get publicKey() {
        return provider?.publicKey || null;
      },

      get publicKeyString() {
        return provider?.publicKey?.toBase58?.() || null;
      },

      async signTransaction(tx) {
        if (!provider) throw new Error('Host wallet provider is unavailable');
        return provider.signTransaction(tx);
      },

      ...(provider && typeof provider.signAndSendTransaction === 'function'
        ? {
            async signAndSendTransaction(tx) {
              return provider.signAndSendTransaction(tx);
            },
          }
        : {}),

      on(event, handler) {
        provider?.on?.(event, handler);
      },

      off(event, handler) {
        provider?.off?.(event, handler);
      },
    };

    const swapper = AquaVaultsSDK.mount('#swap-widget', {
      apiBase: 'https://aquavaults.com',

      wallet: {
        adapter: hostWalletAdapter,
        headless: true,
      },

      community: 'aquavaults',
      lockCommunity: false,

      onWalletChange: (state) => {
        document.getElementById('host-state').textContent =
          state.connected ? `Host wallet: ${state.address}` : 'Host wallet: disconnected';
      },
    });

    document.getElementById('host-connect').addEventListener('click', async () => {
      if (!provider) return alert('Install Phantom or replace the demo provider.');
      await provider.connect();

      // Re-sync is safe and also supports providers that do not emit events.
      swapper.setWalletAdapter(hostWalletAdapter);
    });

    document.getElementById('host-disconnect').addEventListener('click', async () => {
      if (!provider) return;
      await provider.disconnect();
      swapper.setWalletAdapter(hostWalletAdapter);
    });
  </script>
</body>
</html>
