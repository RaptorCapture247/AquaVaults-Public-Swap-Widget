<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaVaults Public SDK — Deep Link Example</title>
  <script src="https://aquavaults.com/sdk/aquavaults-sdk-open.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 480px;
      gap: 40px;
      align-items: start;
    }
    h1 { margin-top: 0; }
    p, li { color: #9aa4b2; line-height: 1.6; }
    code { color: #b9f6e8; }
    a { color: #55d6be; }
    .panel {
      border: 1px solid #242a35;
      border-radius: 14px;
      background: #11151d;
      padding: 18px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid #303846;
      background: #161c26;
      color: #e6edf3;
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { border-color: #55d6be; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>
  <main class="page">
    <div class="layout">
      <section>
        <h1>Deep links</h1>
        <p>
          Reload this page with an <code>av_buy</code> or <code>av_sell</code>
          query parameter. URL values override the configured default pair.
        </p>

        <div class="panel">
          <button id="buy-usdc">Open with USDC as buy token</button>
          <button id="sell-usdc">Open with USDC as sell token</button>
        </div>

        <p>
          Use deep links for arbitrary project-token mint addresses. They are
          better suited than runtime <code>setToken()</code> when the token has
          not already been loaded into the SDK registry.
        </p>
      </section>

      <section>
        <div id="swap-widget"></div>
      </section>
    </div>
  </main>

  <script>
    const SOL  = 'So11111111111111111111111111111111111111112';
    const USDC = 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';

    AquaVaultsSDK.mount('#swap-widget', {
      apiBase: 'https://aquavaults.com',
      defaultFrom: SOL,
      defaultTo: USDC,
    });

    document.getElementById('buy-usdc').onclick = () => {
      const url = new URL(window.location.href);
      url.search = '';
      url.searchParams.set('av_buy', USDC);
      window.location.href = url.toString();
    };

    document.getElementById('sell-usdc').onclick = () => {
      const url = new URL(window.location.href);
      url.search = '';
      url.searchParams.set('av_sell', USDC);
      window.location.href = url.toString();
    };
  </script>
</body>
</html>
